<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zyro Jumping Game Results</title>
 <link rel="icon" type="image/png" href="/favicon.png">

<style>
    :root {
        --zyro-primary: #6366f1; 
        --zyro-secondary: #a855f7; 
        --zyro-bg: #030712;
        --zyro-card: #111827;
        --gold: #fcd34d;
        --silver: #e5e7eb;
        --bronze: #fb923c;
    }

    body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: var(--zyro-bg);
        background-image: 
            radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
            radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.15) 0px, transparent 50%);
        color: #f3f4f6;
        margin: 0;
        padding: 20px;
        min-height: 100vh;
    }

    h1 { 
        text-align: center; 
        font-weight: 800;
        letter-spacing: -0.025em;
        background: linear-gradient(to right, #818cf8, #c084fc);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 10px;
        font-size: 2.5rem;
    }

    .sub-title {
        text-align: center;
        color: #9ca3af;
        margin-bottom: 30px;
        font-size: 0.9rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
    }

    /* Tabs - Date Selection */
    .tabs {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        margin-bottom: 25px;
    }

    .tab {
        padding: 8px 20px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 9999px;
        cursor: pointer;
        transition: all 0.2s ease;
        font-size: 0.85rem;
        font-weight: 500;
        color: #9ca3af;
    }

    .tab:hover {
        background: rgba(255, 255, 255, 0.08);
        color: white;
    }

    .tab.active { 
        background: var(--zyro-primary); 
        color: white;
        border-color: var(--zyro-primary);
        box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }

    /* Active Date Display */
    #selectedDateDisplay {
        text-align: center;
        margin-bottom: 20px;
        font-size: 1.1rem;
        font-weight: 600;
        color: #e5e7eb;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
    }

    #selectedDateDisplay::before {
        content: "📅";
        font-size: 1rem;
    }

    /* Search */
    .search-box {
        max-width: 500px;
        margin: 0 auto 30px auto;
    }

    .search-box input {
        width: 100%;
        padding: 14px 20px;
        background: var(--zyro-card);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        color: white;
        font-size: 1rem;
        box-sizing: border-box;
    }

    .search-box input:focus {
        outline: none;
        border-color: var(--zyro-primary);
        box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
    }

    /* Table Container */
    #content {
        max-width: 800px;
        margin: 0 auto;
        background: var(--zyro-card);
        border-radius: 16px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.05);
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
    }

    table {
        width: 100%;
        border-collapse: collapse;
    }

    th { 
        background: rgba(255, 255, 255, 0.02);
        padding: 16px;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #6b7280;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    td {
        padding: 16px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.02);
        font-size: 0.95rem;
        text-align: center;
    }

    .gold { background: rgba(252, 211, 77, 0.05); color: var(--gold); font-weight: bold; }
    .silver { color: var(--silver); font-weight: bold; }
    .bronze { color: var(--bronze); font-weight: bold; }

    tr:hover:not(th) {
        background: rgba(255, 255, 255, 0.04);
        cursor: pointer;
    }

    /* Popup */
    .popup {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.85);
        backdrop-filter: blur(6px);
        justify-content: center;
        align-items: center;
        z-index: 100;
    }

    .popup-content {
        background: #1f2937;
        padding: 40px;
        border-radius: 28px;
        text-align: center;
        width: 90%;
        max-width: 320px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        position: relative;
    }

    .close {
        position: absolute;
        right: 20px;
        top: 15px;
        color: #9ca3af;
        font-size: 28px;
        cursor: pointer;
    }

</style>
</head>

<body>

<h1>Zyro Jumping Game</h1>
<div class="sub-title">Daily Result</div>

<div class="tabs" id="tabs"></div>

<div id="selectedDateDisplay">Loading date...</div>

<div class="search-box">
    <input type="text" id="searchInput" placeholder="Search Player Name or Email...">
</div>

<div id="content">
    <div style="padding: 40px; text-align: center; color: #6b7280;">Initializing data...</div>
</div>

<!-- Popup -->
<div id="popup" class="popup" onclick="if(event.target == this) closePopup()">
    <div class="popup-content">
        <span class="close" onclick="closePopup()">&times;</span>
        <div id="popupEmoji" style="font-size: 4rem; margin-bottom: 10px;">🏆</div>
        <h2 id="popupTitle" style="margin: 10px 0;"></h2>
        <p id="popupScore" style="font-size: 1.5rem; color: var(--zyro-primary); font-weight: bold; margin: 5px 0;"></p>
        <p id="popupRank" style="color: #9ca3af; margin-top: 10px;"></p>
    </div>
</div>

<script>
const API_URL = "/api/data";

let sheetData = {};
let originalSheetData = {};
let currentSheet = "";
let searchTimeout;

async function loadSheets() {
    try {
        const res = await fetch(API_URL);
        const data = await res.json();

        sheetData = data;
        originalSheetData = data;

        const sheetNames = Object.keys(data).sort((a, b) => new Date(b) - new Date(a));

        if (sheetNames.length === 0) {
            document.getElementById("content").innerHTML = "<div style='padding:20px;'>No data available.</div>";
            return;
        }

        currentSheet = sheetNames[0];
        createTabs(sheetNames);
        renderTable(sheetData[currentSheet]);
    } catch (e) {
        document.getElementById("content").innerHTML = "<div style='padding:20px; color:#ef4444;'>Failed to connect to API.</div>";
    }
}

function createTabs(names) {
    const tabs = document.getElementById("tabs");
    tabs.innerHTML = "";
    names.forEach(name => {
        const tab = document.createElement("div");
        tab.className = `tab ${name === currentSheet ? 'active' : ''}`;
        tab.innerText = name;
        tab.onclick = () => {
            currentSheet = name;
            renderTable(originalSheetData[name]);
            updateTabs();
        };
        tabs.appendChild(tab);
    });
}

function updateTabs() {
    document.querySelectorAll(".tab").forEach(tab => {
        tab.classList.toggle("active", tab.innerText === currentSheet);
    });
}

function renderTable(data) {
    // Update the Date Heading
    document.getElementById("selectedDateDisplay").innerText = `Results for ${currentSheet}`;

    if (!data || data.length === 0) {
        document.getElementById("content").innerHTML = "<div style='padding:40px; text-align:center;'>No entries for this date.</div>";
        return;
    }

    let html = "<table><thead><tr><th>Rank</th><th style='text-align:left;'>Player</th><th>Score</th></tr></thead><tbody>";

    data.forEach(row => {
        let rank = Number(row.Rank);
        let medal = "";
        let rowClass = "";

        if (rank === 1) { medal = "🥇"; rowClass = "gold"; }
        else if (rank === 2) { medal = "🥈"; rowClass = "silver"; }
        else if (rank === 3) { medal = "🥉"; rowClass = "bronze"; }
        else { medal = `<span style="opacity:0.3;">${rank}</span>`; }

        html += `
        <tr class="${rowClass}" onclick="showPopup('${row.Name}', '${row.Score}', '${rank}')">
            <td style="width: 80px;">${medal}</td>
            <td style="text-align: left; font-weight: 500;">${row.Name || "Unknown Player"}</td>
            <td style="font-family: 'Courier New', monospace; font-weight: bold;">${row.Score || "0"}</td>
        </tr>`;
    });

    html += "</tbody></table>";
    document.getElementById("content").innerHTML = html;
}

function searchDataLive(query) {
    if (!query) {
        renderTable(originalSheetData[currentSheet]);
        return;
    }
    query = query.toLowerCase();
    const filtered = originalSheetData[currentSheet].filter(row => {
        const name = (row.Name || "").toLowerCase();
        const email = (row.Email || row.email || "").toLowerCase();
        return name.includes(query) || email.includes(query);
    });
    renderTable(filtered);
}

document.getElementById("searchInput").addEventListener("input", (e) => {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => {
        searchDataLive(e.target.value);
    }, 300);
});

function showPopup(name, score, rank) {
    document.getElementById("popup").style.display = "flex";
    let emoji = "🏆";
    if (rank == 1) emoji = "🥇";
    else if (rank == 2) emoji = "🥈";
    else if (rank == 3) emoji = "🥉";

    document.getElementById("popupEmoji").innerHTML = emoji;
    document.getElementById("popupTitle").innerText = name;
    document.getElementById("popupScore").innerText = score;
    document.getElementById("popupRank").innerText = `Position: Rank #${rank}`;
}

function closePopup() {
    document.getElementById("popup").style.display = "none";
}

loadSheets();
</script>

</body>
</html>
