<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Results</title>
</head>

<body>

<h2>Game Results</h2>

<div id="tabs"></div>
<input id="searchInput" placeholder="Search">
<button onclick="searchData()">Search</button>

<div id="content"></div>

<script>
const API_URL = "/api/data";

let sheetData = {};
let currentSheet = "";

async function loadSheets() {
  const res = await fetch(API_URL);
  const data = await res.json();

  sheetData = data;
  const names = Object.keys(data);

  currentSheet = names[0];

  createTabs(names);
  renderTable(sheetData[currentSheet]);
}

function createTabs(names) {
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = "";

  names.forEach(name => {
    const btn = document.createElement("button");
    btn.innerText = name;

    btn.onclick = () => {
      currentSheet = name;
      renderTable(sheetData[name]);
    };

    tabs.appendChild(btn);
  });
}

function renderTable(data) {
  let html = "<table border='1'><tr><th>Rank</th><th>Name</th><th>Score</th></tr>";

  data.forEach(r => {
    html += `<tr>
      <td>${r.Rank}</td>
      <td>${r.Name}</td>
      <td>${r.Score}</td>
    </tr>`;
  });

  html += "</table>";
  document.getElementById("content").innerHTML = html;
}

function searchData() {
  const q = document.getElementById("searchInput").value.toLowerCase();

  const filtered = sheetData[currentSheet].filter(r =>
    (r.Name && r.Name.toLowerCase().includes(q))
  );

  renderTable(filtered);
}

loadSheets();
</script>

</body>
</html>
