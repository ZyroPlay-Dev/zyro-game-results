
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Results</title>

<style>
body {
    font-family: Arial;
    background: linear-gradient(135deg, #0f172a, #312e81);
    color: white;
    margin: 0;
    padding: 20px;
}

h1 { text-align: center; }

/* Tabs */
.tabs {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    margin: 20px 0;
}

.tab {
    padding: 10px 15px;
    margin: 5px;
    background: rgba(255,255,255,0.1);
    border-radius: 8px;
    cursor: pointer;
}

.tab.active { background: #6366f1; }

/* Search */
.search-box {
    max-width: 400px;
    margin: 10px auto;
    display: flex;
}

.search-box input {
    flex: 1;
    padding: 10px;
    border: none;
}

.search-box button {
    display: none; /* hidden (live search used) */
}

/* Table */
table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
}

th, td {
    padding: 10px;
    text-align: center;
}

th { background: #6366f1; }

tr:nth-child(even) {
    background: rgba(255,255,255,0.05);
}
</style>
</head>

<body>

<h1>🎮 Game Results</h1>

<div class="tabs" id="tabs"></div>

<div class="search-box">
    <input type="text" id="searchInput" placeholder="Search Name or Email">
</div>

<div id="content">Loading...</div>

<script>
const API_URL = "/api/data";

let sheetData = {};
let currentSheet = "";
let originalSheetData = {}; // keep original copy
let searchTimeout;

// Load all data
async function loadSheets() {
    const res = await fetch(API_URL);
    const data = await res.json();

    sheetData = data;
    originalSheetData = data;

    // Sort sheet names (latest date first)
    const sheetNames = Object.keys(data).sort((a, b) => {
        return new Date(b) - new Date(a);
    });

    if (sheetNames.length === 0) {
        document.getElementById("content").innerHTML = "No data found";
        return;
    }

    currentSheet = sheetNames[0];

    createTabs(sheetNames);
    renderTable(sheetData[currentSheet]);
}

// Create tabs
function createTabs(names) {
    const tabs = document.getElementById("tabs");
    tabs.innerHTML = "";

    names.forEach(name => {
        const tab = document.createElement("div");
        tab.className = "tab";
        tab.innerText = name;

        if (name === currentSheet) tab.classList.add("active");

        tab.onclick = () => {
            currentSheet = name;
            renderTable(sheetData[name]);
            updateTabs();
        };

        tabs.appendChild(tab);
    });
}

// Update active tab
function updateTabs() {
    document.querySelectorAll(".tab").forEach(tab => {
        tab.classList.remove("active");
        if (tab.innerText === currentSheet) tab.classList.add("active");
    });
}

// Render table
function renderTable(data) {
    if (!data || data.length === 0) {
        document.getElementById("content").innerHTML = "No results found";
        return;
    }

    let html = "<table><tr><th>Rank</th><th>Name</th><th>Score</th></tr>";

    data.forEach(row => {
        html += `
        <tr>
            <td>${row.Rank || ""}</td>
            <td>${row.Name || ""}</td>
            <td>${row.Score || ""}</td>
        </tr>`;
    });

    html += "</table>";
    document.getElementById("content").innerHTML = html;
}

// Live Search (client-side)
function searchDataLive(query) {
    if (!query) {
        renderTable(originalSheetData[currentSheet]);
        return;
    }

    const filtered = originalSheetData[currentSheet].filter(row =>
        (row.Name && row.Name.toLowerCase().includes(query.toLowerCase())) ||
        (row.Email && row.Email.toLowerCase().includes(query.toLowerCase()))
    );

    renderTable(filtered);
}

// Input event (debounce)
document.getElementById("searchInput").addEventListener("input", (e) => {
    clearTimeout(searchTimeout);

    searchTimeout = setTimeout(() => {
        searchDataLive(e.target.value);
    }, 300);
});

// Init
loadSheets();
</script>

</body>
</html>
