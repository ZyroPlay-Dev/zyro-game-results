<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zyro Jumping Game Results</title>
<link rel="icon" type="image/png" href="/favicon.png">

<style>
    :root {
        --primary: #ff2e63;
            --secondary: #08d9d6;
            --bg-dark: #0f0f1a;
            --card-bg: rgba(255, 255, 255, 0.05);
            --gold: #f9d423;
            --silver: #bdc3c7;
            --bronze: #cd7f32;
        }

        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at top right, #1a1a2e, #0f0f1a, #050505);
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            padding: 20px 15px;
            position: relative;
        }

        .header-section {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-weight: 800;
            font-size: 2.2rem;
            margin-bottom: 10px;
            background: linear-gradient(to right, #fff, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

@keyframes gradientMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

    .sub-title {
        text-align: center;
        color: #9ca3af;
        margin-bottom: 30px;
        font-size: 0.9rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
    }

    /* Tabs */
    .tabs {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        margin-bottom: 25px;
    }

    .tab {
        padding: 8px 20px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 9999px;
        cursor: pointer;
        transition: all 0.2s ease;
        font-size: 0.85rem;
        font-weight: 500;
        color: #9ca3af;
    }

    .tab.active { 
        background: var(--zyro-primary); 
        color: white;
        border-color: var(--zyro-primary);
        box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }

    .tab.more {
        background: rgba(168, 85, 247, 0.1);
        border: 1px dashed var(--zyro-secondary);
        color: var(--zyro-secondary);
    }

    /* Search Box */
    .search-box { max-width: 500px; margin: 0 auto 30px auto; }
    .search-box input {
        width: 100%; padding: 14px 20px; background: var(--zyro-card);
        border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px;
        color: white; font-size: 1rem; box-sizing: border-box;
    }

    /* Table */
    #content {
        max-width: 800px; margin: 0 auto; background: var(--zyro-card);
        border-radius: 16px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.05);
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
    }

    table { width: 100%; border-collapse: collapse; }
    th { background: rgba(255, 255, 255, 0.02); padding: 16px; color: #6b7280; font-size: 0.75rem; text-transform: uppercase; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
    td { padding: 16px; border-bottom: 1px solid rgba(255, 255, 255, 0.02); text-align: center; }

    /* Score Coloring */
    .score-gold { color: var(--gold); font-weight: 800; }
    .score-silver { color: var(--silver); font-weight: 800; }
    .score-bronze { color: var(--bronze); font-weight: 800; }
    .score-default { font-family: monospace; font-weight: bold; }

    /* Calendar Modal */
    #calendarModal {
        display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9);
        z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(8px);
    }

    .cal-container {
        background: #1f2937; padding: 25px; border-radius: 20px; width: 90%; max-width: 350px;
        border: 1px solid rgba(255,255,255,0.1);
    }

    .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; text-align: center; }
    .cal-day-name { font-size: 0.7rem; color: #6b7280; font-weight: bold; }
    
    .cal-date {
        padding: 10px 0; border-radius: 8px; font-size: 0.9rem; cursor: pointer;
        transition: 0.2s; border: 1px solid transparent;
    }

    .date-available { background: rgba(34, 197, 94, 0.15); color: var(--success); border-color: var(--success); font-weight: bold; }
    .date-empty { background: rgba(239, 68, 68, 0.1); color: var(--error); border-color: rgba(239, 68, 68, 0.3); cursor: not-allowed; opacity: 0.7; }
    
    .cal-date:hover:not(.date-empty) { transform: scale(1.1); background: var(--success); color: white; }

    /* Rank Popup */
    .popup { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 100; justify-content: center; align-items: center; }
    .popup-content { background: #1f2937; padding: 40px; border-radius: 28px; text-align: center; width: 90%; max-width: 320px; position: relative; }
    .close { position: absolute; right: 20px; top: 15px; color: #9ca3af; font-size: 28px; cursor: pointer; }
</style>
</head>

<body>

<h1>Zyro Jumping Game</h1>
<div class="sub-title">Daily Result</div>

<div class="tabs" id="tabs"></div>

<div id="selectedDateDisplay" style="text-align: center; margin-bottom: 20px; font-weight: 600; color: #e5e7eb;">Loading...</div>

<div class="search-box">
    <input type="text" id="searchInput" placeholder="Search Player Name or Email...">
</div>

<div id="content"></div>

<!-- Calendar Modal -->
<div id="calendarModal" onclick="if(event.target == this) this.style.display='none'">
    <div class="cal-container">
        <div class="cal-header">
            <button onclick="changeMonth(-1)" style="background:none; border:none; color:white; font-size: 1.2rem; cursor:pointer;">◀</button>
            <span id="calMonthYear" style="font-weight: bold; color: white;"></span>
            <button onclick="changeMonth(1)" style="background:none; border:none; color:white; font-size: 1.2rem; cursor:pointer;">▶</button>
        </div>
        <div class="cal-grid" id="calGrid">
            <div class="cal-day-name">Sun</div><div class="cal-day-name">Mon</div><div class="cal-day-name">Tue</div>
            <div class="cal-day-name">Wed</div><div class="cal-day-name">Thu</div><div class="cal-day-name">Fri</div>
            <div class="cal-day-name">Sat</div>
        </div>
    </div>
</div>

<!-- Popup -->
<div id="popup" class="popup" onclick="if(event.target == this) closePopup()">
    <div class="popup-content">
        <span class="close" onclick="closePopup()">&times;</span>
        <div id="popupEmoji" style="font-size: 4rem;">🏆</div>
        <h2 id="popupTitle"></h2>
        <p id="popupScore" style="color: var(--zyro-primary); font-size: 1.5rem; font-weight: bold;"></p>
        <p id="popupRank" style="color: #9ca3af;"></p>
    </div>
</div>

<script>
const API_URL = "/api/data";
let originalSheetData = {};
let currentSheet = "";
let viewDate = new Date(); 
let searchTimeout;

function formatDateForSheet(date) {
    const months = ["Jan", "Feb", "Mar", "Apr", "May", "June", "July", "Aug", "Sept", "Oct", "Nov", "Dec"];
    const day = String(date.getDate()).padStart(2, '0');
    const month = months[date.getMonth()];
    const year = date.getFullYear();
    return `${day}-${month}-${year}`;
}

async function loadSheets() {
    try {
        const res = await fetch(API_URL);
        const data = await res.json();
        originalSheetData = data;

        const sheetNames = Object.keys(data).sort((a, b) => new Date(b) - new Date(a));
        if (sheetNames.length === 0) return;

        currentSheet = sheetNames[0];
        createTabs(sheetNames);
        renderTable(data[currentSheet]);
    } catch (e) {
        document.getElementById("content").innerHTML = "<div style='padding:40px; text-align:center;'>Error loading data.</div>";
    }
}

function createTabs(names) {
    const tabs = document.getElementById("tabs");
    tabs.innerHTML = "";
    names.slice(0, 4).forEach(name => {
        const tab = document.createElement("div");
        tab.className = `tab ${name === currentSheet ? 'active' : ''}`;
        tab.innerText = name;
        tab.onclick = () => { currentSheet = name; renderTable(originalSheetData[name]); updateTabs(); };
        tabs.appendChild(tab);
    });

    const moreBtn = document.createElement("div");
    moreBtn.className = "tab more";
    moreBtn.innerText = "📅 More";
    moreBtn.onclick = () => { document.getElementById("calendarModal").style.display = "flex"; renderCalendar(); };
    tabs.appendChild(moreBtn);
}

function updateTabs() {
    document.querySelectorAll(".tab").forEach(tab => tab.classList.toggle("active", tab.innerText === currentSheet));
}

function renderCalendar() {
    const grid = document.getElementById("calGrid");
    const monthYear = document.getElementById("calMonthYear");
    const headers = Array.from(grid.querySelectorAll('.cal-day-name'));
    grid.innerHTML = "";
    headers.forEach(h => grid.appendChild(h));

    const year = viewDate.getFullYear();
    const month = viewDate.getMonth();
    monthYear.innerText = new Intl.DateTimeFormat('en-US', { month: 'long', year: 'numeric' }).format(viewDate);

    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();

    for (let i = 0; i < firstDay; i++) grid.appendChild(document.createElement("div"));

    for (let day = 1; day <= daysInMonth; day++) {
        const dateObj = new Date(year, month, day);
        const dateKey = formatDateForSheet(dateObj);
        const cell = document.createElement("div");
        cell.className = "cal-date";
        cell.innerText = day;

        if (originalSheetData[dateKey]) {
            cell.classList.add("date-available");
            cell.onclick = () => {
                currentSheet = dateKey;
                renderTable(originalSheetData[dateKey]);
                updateTabs();
                document.getElementById("calendarModal").style.display = "none";
            };
        } else {
            cell.classList.add("date-empty");
        }
        grid.appendChild(cell);
    }
}

function changeMonth(offset) {
    viewDate.setMonth(viewDate.getMonth() + offset);
    renderCalendar();
}

function renderTable(data) {
    document.getElementById("selectedDateDisplay").innerText = `Results for ${currentSheet}`;
    if (!data || data.length === 0) {
        document.getElementById("content").innerHTML = "<div style='padding:40px; text-align:center;'>No results.</div>";
        return;
    }

    let html = "<table><thead><tr><th>Rank</th><th style='text-align:left;'>Player</th><th>Score</th></tr></thead><tbody>";
    data.forEach(row => {
        let rank = Number(row.Rank);
        let medal = rank === 1 ? "🥇" : rank === 2 ? "🥈" : rank === 3 ? "🥉" : `<span style="opacity:0.3;">${rank}</span>`;
        
        // Color score by rank
        let scoreClass = "score-default";
        if (rank === 1) scoreClass = "score-gold";
        else if (rank === 2) scoreClass = "score-silver";
        else if (rank === 3) scoreClass = "score-bronze";

        html += `<tr onclick="showPopup('${row.Name}', '${row.Score}', '${rank}')">
            <td>${medal}</td>
            <td style='text-align:left; font-weight:500;'>${row.Name || "Unknown"}</td>
            <td class="${scoreClass}">${row.Score || 0}</td>
        </tr>`;
    });
    document.getElementById("content").innerHTML = html + "</tbody></table>";
}

// Search Logic: Checks Name and Email
document.getElementById("searchInput").addEventListener("input", (e) => {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => {
        const query = e.target.value.toLowerCase();
        if (!query) {
            renderTable(originalSheetData[currentSheet]);
            return;
        }
        const filtered = originalSheetData[currentSheet].filter(row => {
            const name = (row.Name || "").toLowerCase();
            const email = (row.Email || row.email || "").toLowerCase();
            return name.includes(query) || email.includes(query);
        });
        renderTable(filtered);
    }, 300);
});

function showPopup(name, score, rank) {
    document.getElementById("popup").style.display = "flex";
    document.getElementById("popupTitle").innerText = name;
    document.getElementById("popupScore").innerText = score;
    document.getElementById("popupRank").innerText = `Position: Rank #${rank}`;
    document.getElementById("popupEmoji").innerText = rank == 1 ? "🥇" : rank == 2 ? "🥈" : rank == 3 ? "🥉" : "🏆";
}

function closePopup() { document.getElementById("popup").style.display = "none"; }

loadSheets();
</script>
</body>
</html>
