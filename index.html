
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Results</title>

<style>
body {
    font-family: Arial;
    background: linear-gradient(135deg, #0f172a, #312e81);
    color: white;
    margin: 0;
    padding: 20px;
}

h1 { text-align: center; }

/* Tabs */
.tabs {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    margin: 20px 0;
}

.tab {
    padding: 10px 15px;
    margin: 5px;
    background: rgba(255,255,255,0.1);
    border-radius: 8px;
    cursor: pointer;
}

.tab.active { background: #6366f1; }

/* Search */
.search-box {
    max-width: 400px;
    margin: 10px auto;
}

.search-box input {
    width: 100%;
    padding: 10px;
    border: none;
}

/* Table */
table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
}

th, td {
    padding: 10px;
    text-align: center;
}

th { background: #6366f1; }

tr:nth-child(even) {
    background: rgba(255,255,255,0.05);
}

/* Top 3 Animated Glow */
@keyframes glowGold {
    0% { box-shadow: 0 0 5px gold; }
    50% { box-shadow: 0 0 20px gold; }
    100% { box-shadow: 0 0 5px gold; }
}

@keyframes glowSilver {
    0% { box-shadow: 0 0 5px silver; }
    50% { box-shadow: 0 0 15px silver; }
    100% { box-shadow: 0 0 5px silver; }
}

@keyframes glowBronze {
    0% { box-shadow: 0 0 5px peru; }
    50% { box-shadow: 0 0 15px peru; }
    100% { box-shadow: 0 0 5px peru; }
}

.gold {
    background: rgba(255, 215, 0, 0.2);
    animation: glowGold 2s infinite;
    cursor: pointer;
}

.silver {
    background: rgba(192, 192, 192, 0.2);
    animation: glowSilver 2s infinite;
    cursor: pointer;
}

.bronze {
    background: rgba(205, 127, 50, 0.2);
    animation: glowBronze 2s infinite;
    cursor: pointer;
}

/* Popup */
.popup {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.7);
    justify-content: center;
    align-items: center;
}

.popup-content {
    background: #1e293b;
    padding: 20px;
    border-radius: 12px;
    text-align: center;
    min-width: 250px;
    animation: popupScale 0.3s ease;
}

@keyframes popupScale {
    from { transform: scale(0.7); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}

.close {
    position: absolute;
    right: 20px;
    top: 10px;
    cursor: pointer;
    font-size: 20px;
}
</style>
</head>

<body>

<h1>🎮 Game Results</h1>

<div class="tabs" id="tabs"></div>

<div class="search-box">
    <input type="text" id="searchInput" placeholder="Search Name or Email">
</div>

<div id="content">Loading...</div>

<!-- Popup -->
<div id="popup" class="popup">
    <div class="popup-content">
        <span class="close" onclick="closePopup()">×</span>
        <h2 id="popupTitle"></h2>
        <p id="popupScore"></p>
        <p id="popupRank"></p>
    </div>
</div>

<script>
const API_URL = "/api/data";

let sheetData = {};
let originalSheetData = {};
let currentSheet = "";
let searchTimeout;

// Load data
async function loadSheets() {
    const res = await fetch(API_URL);
    const data = await res.json();

    sheetData = data;
    originalSheetData = data;

    const sheetNames = Object.keys(data).sort((a, b) => new Date(b) - new Date(a));

    if (sheetNames.length === 0) {
        document.getElementById("content").innerHTML = "No data found";
        return;
    }

    currentSheet = sheetNames[0];

    createTabs(sheetNames);
    renderTable(sheetData[currentSheet]);
}

// Tabs
function createTabs(names) {
    const tabs = document.getElementById("tabs");
    tabs.innerHTML = "";

    names.forEach(name => {
        const tab = document.createElement("div");
        tab.className = "tab";
        tab.innerText = name;

        if (name === currentSheet) tab.classList.add("active");

        tab.onclick = () => {
            currentSheet = name;
            renderTable(originalSheetData[name]);
            updateTabs();
        };

        tabs.appendChild(tab);
    });
}

function updateTabs() {
    document.querySelectorAll(".tab").forEach(tab => {
        tab.classList.remove("active");
        if (tab.innerText === currentSheet) tab.classList.add("active");
    });
}

// Render table
function renderTable(data) {
    if (!data || data.length === 0) {
        document.getElementById("content").innerHTML = "No results found";
        return;
    }

    let html = "<table><tr><th>Rank</th><th>Name</th><th>Score</th></tr>";

    data.forEach(row => {
        let rank = Number(row.Rank);
        let medal = "";
        let rowClass = "";

        if (rank === 1) {
            medal = "🥇";
            rowClass = "gold";
        } else if (rank === 2) {
            medal = "🥈";
            rowClass = "silver";
        } else if (rank === 3) {
            medal = "🥉";
            rowClass = "bronze";
        }

        html += `
        <tr class="${rowClass}" onclick="showPopup('${row.Name}', '${row.Score}', '${rank}')">
            <td>${medal} ${rank || ""}</td>
            <td>${row.Name || ""}</td>
            <td>${row.Score || ""}</td>
        </tr>`;
    });

    html += "</table>";
    document.getElementById("content").innerHTML = html;
}

// Live search (Name + Email, email hidden)
function searchDataLive(query) {
    if (!query) {
        renderTable(originalSheetData[currentSheet]);
        return;
    }

    query = query.toLowerCase();

    const filtered = originalSheetData[currentSheet].filter(row => {
        const name = (row.Name || "").toLowerCase();
        const email = (row.Email || row.email || "").toLowerCase();

        return name.includes(query) || email.includes(query);
    });

    renderTable(filtered);
}

// Input listener
document.getElementById("searchInput").addEventListener("input", (e) => {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => {
        searchDataLive(e.target.value);
    }, 300);
});

// Popup
function showPopup(name, score, rank) {
    document.getElementById("popup").style.display = "flex";

    let trophy = "🏆";
    if (rank == 1) trophy = "🥇";
    else if (rank == 2) trophy = "🥈";
    else if (rank == 3) trophy = "🥉";

    document.getElementById("popupTitle").innerHTML = `${trophy} ${name}`;
    document.getElementById("popupScore").innerHTML = `Score: ${score}`;
    document.getElementById("popupRank").innerHTML = `Rank: ${rank}`;
}

function closePopup() {
    document.getElementById("popup").style.display = "none";
}

// Init
loadSheets();
</script>

</body>
</html>
